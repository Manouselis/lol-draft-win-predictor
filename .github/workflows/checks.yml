name: Test and build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python scripts/check_secrets.py --history
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '11.25.0'
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q
      - run: python -m ruff check backend tests tests_pi scripts/pi
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter league-draft-lab-ui test
      - run: pnpm --filter league-draft-lab-ui build
      - run: pnpm audit --audit-level moderate
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit -r requirements.lock --disable-pip --no-deps
  collector-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m venv .collector-venv
      - run: .collector-venv/bin/python -m pip install -r requirements-collector.lock pytest==9.1.1
      - run: .collector-venv/bin/python -m pip check
      - run: .collector-venv/bin/python -m pytest tests_pi -q
      - run: bash -n scripts/pi/install.sh
      - name: Verify systemd configuration
        shell: bash
        run: |
          mkdir -p data "$RUNNER_TEMP/draft-state"
          sed -e "s|@USER@|$(id -un)|g" -e "s|@GROUP@|$(id -gn)|g" \
              -e "s|@ROOT@|$GITHUB_WORKSPACE|g" -e "s|@STATE@|$RUNNER_TEMP/draft-state|g" \
              scripts/pi/league-draft-collector.service.in > "$RUNNER_TEMP/league-draft-collector.service"
          systemd-analyze verify "$RUNNER_TEMP/league-draft-collector.service"
